<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アラーム</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --fg: #1c1c1c;
      --muted: #8a8a8a;
      --accent: #e5533d;
      --card: #ffffff;
      --line: #e3e3e0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141414;
        --fg: #f2f2f2;
        --muted: #8a8a8a;
        --accent: #ff6a52;
        --card: #1e1e1e;
        --line: #2e2e2e;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    }
    main { width: 100%; max-width: 360px; text-align: center; }
    #clock {
      font-size: clamp(56px, 18vw, 88px);
      font-weight: 200;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }
    #date { color: var(--muted); margin-top: 4px; }
    .card {
      margin-top: 40px;
      padding: 24px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
    }
    input[type="time"] {
      width: 100%;
      font: inherit;
      font-size: 32px;
      text-align: center;
      padding: 8px;
      color: var(--fg);
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line);
      outline: none;
      color-scheme: light dark;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      font: inherit;
      font-size: 17px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: var(--bg);
      background: var(--fg);
    }
    body.armed #toggle { background: transparent; color: var(--fg); border: 1px solid var(--line); }
    #status { margin-top: 16px; min-height: 1.4em; color: var(--muted); font-size: 14px; }
    body.armed #status { color: var(--accent); }

    #ringing {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 16px;
      background: var(--accent);
      color: #fff;
      animation: pulse 1s ease-in-out infinite;
    }
    body.ringing #ringing { display: flex; }
    #ringing p { font-size: 28px; }
    #ringing button { max-width: 280px; background: #fff; color: var(--accent); font-weight: 600; }
    @keyframes pulse { 50% { opacity: 0.85; } }
  </style>
</head>
<body>
  <main>
    <div id="clock">--:--:--</div>
    <div id="date"></div>
    <div class="card">
      <input id="time" type="time" value="07:00" aria-label="アラーム時刻">
      <button id="toggle">セット</button>
      <div id="status"></div>
    </div>
  </main>

  <div id="ringing">
    <p>⏰ <span id="ringTime"></span></p>
    <button id="stop">止める</button>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const pad = (n) => String(n).padStart(2, "0");

    let alarm = null;      // "HH:MM" or null
    let lastFired = null;  // prevents firing twice in the same minute
    let audio = null;
    let beepTimer = null;

    try { alarm = localStorage.getItem("alarm"); } catch (e) {}

    function render() {
      document.body.classList.toggle("armed", !!alarm);
      $("toggle").textContent = alarm ? "解除" : "セット";
      $("time").disabled = !!alarm;
      if (alarm) $("time").value = alarm;
      $("status").textContent = alarm ? `${alarm} に鳴ります` : "";
    }

    function save() {
      try {
        if (alarm) localStorage.setItem("alarm", alarm);
        else localStorage.removeItem("alarm");
      } catch (e) {}
    }

    // Short beeps via Web Audio, so no sound file is needed
    function beep() {
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.3, audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.4);
      osc.connect(gain).connect(audio.destination);
      osc.start();
      osc.stop(audio.currentTime + 0.4);
    }

    function ring() {
      $("ringTime").textContent = alarm;
      document.body.classList.add("ringing");
      if (audio) { beep(); beepTimer = setInterval(beep, 600); }
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("アラーム", { body: `${alarm} になりました` });
      }
    }

    function stop() {
      clearInterval(beepTimer);
      document.body.classList.remove("ringing");
      alarm = null;
      save();
      render();
    }

    function tick() {
      const now = new Date();
      const hm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
      $("clock").textContent = `${hm}:${pad(now.getSeconds())}`;
      $("date").textContent = now.toLocaleDateString("ja-JP", { month: "long", day: "numeric", weekday: "short" });
      if (alarm && alarm === hm && lastFired !== hm && !document.body.classList.contains("ringing")) {
        lastFired = hm;
        ring();
      }
    }

    $("toggle").addEventListener("click", () => {
      if (alarm) {
        alarm = null;
      } else {
        if (!$("time").value) return;
        alarm = $("time").value;
        // Browsers only allow sound after a user gesture, so unlock audio here
        audio = audio || new (window.AudioContext || window.webkitAudioContext)();
        audio.resume();
        if ("Notification" in window && Notification.permission === "default") {
          Notification.requestPermission();
        }
      }
      save();
      render();
    });
    $("stop").addEventListener("click", stop);

    render();
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
